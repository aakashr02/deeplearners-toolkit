[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "A lightweight numerical computing toolkit built with NumPy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
test = ["pytest>=7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["."]